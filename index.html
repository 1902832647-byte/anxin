<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="安心账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>安心账</title>
<style>
:root{
  --bg:#ffffff; --text:#16161a; --sub:#7d7d86; --faint:#b6b6bf; --hair:rgba(20,20,30,.07);
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.92),rgba(247,247,250,.78));
  --glass-strong:linear-gradient(180deg,rgba(255,255,255,.88),rgba(250,250,252,.8));
  --spec:rgba(255,255,255,.9); --rim-hi:rgba(255,255,255,1); --rim-lo:rgba(20,20,40,.05); --rim-mid:rgba(20,20,40,.08);
  --glass-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 .5px rgba(20,20,40,.05),0 2px 6px rgba(20,20,40,.04),0 14px 34px rgba(20,20,40,.07);
  --press-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 .5px rgba(20,20,40,.05),0 1px 3px rgba(20,20,40,.05);
  --pill:linear-gradient(180deg,rgba(255,255,255,1),rgba(244,244,248,.9));
  --field:rgba(20,20,40,.035);
  --ink:linear-gradient(180deg,rgba(44,44,50,.92),rgba(18,18,22,.96)); --ink-text:#fff;
  --scrim:rgba(255,255,255,.25); --warn:#d8626a;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.3,1.3,.55,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Helvetica Neue",system-ui,sans-serif;
  color:var(--text); -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c10; --text:#f4f4f6; --sub:#9b9ba5; --faint:#55555e; --hair:rgba(255,255,255,.08);
    --glass-fill:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    --glass-strong:linear-gradient(180deg,rgba(40,40,48,.82),rgba(26,26,32,.78));
    --spec:rgba(255,255,255,.12); --rim-hi:rgba(255,255,255,.34); --rim-lo:rgba(255,255,255,.04); --rim-mid:rgba(255,255,255,.14);
    --glass-shadow:inset 0 1px 1px rgba(255,255,255,.08),0 14px 34px rgba(0,0,0,.45);
    --press-shadow:inset 0 1px 1px rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.35);
    --pill:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));
    --field:rgba(255,255,255,.06);
    --ink:linear-gradient(180deg,rgba(250,250,252,.95),rgba(225,225,232,.92)); --ink-text:#111;
    --scrim:rgba(0,0,0,.25);
    --b1:#4a2a26; --b2:#2c2552; --b3:#1a3350; --b4:#173329; --grain:.07; --grain-mode:screen;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c10; --text:#f4f4f6; --sub:#9b9ba5; --faint:#55555e; --hair:rgba(255,255,255,.08);
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  --glass-strong:linear-gradient(180deg,rgba(40,40,48,.82),rgba(26,26,32,.78));
  --spec:rgba(255,255,255,.12); --rim-hi:rgba(255,255,255,.34); --rim-lo:rgba(255,255,255,.04); --rim-mid:rgba(255,255,255,.14);
  --glass-shadow:inset 0 1px 1px rgba(255,255,255,.08),0 14px 34px rgba(0,0,0,.45);
  --press-shadow:inset 0 1px 1px rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.35);
  --pill:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));
  --field:rgba(255,255,255,.06);
  --ink:linear-gradient(180deg,rgba(250,250,252,.95),rgba(225,225,232,.92)); --ink-text:#111;
  --scrim:rgba(0,0,0,.25);
  --b1:#4a2a26; --b2:#2c2552; --b3:#1a3350; --b4:#173329; --grain:.07; --grain-mode:screen;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #8aa8e8;outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- 背景：柔和色彩 + 细颗粒，让玻璃有东西可以折射 ---------- */
.bg{display:none;--p:0}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.95;transition:transform 1.8s cubic-bezier(.45,0,.2,1)}
.b1{width:90vw;height:90vw;background:var(--b1);left:-30vw;top:-22vw;transform:translate(calc(var(--p)*28px),calc(var(--p)*12px))}
.b2{width:85vw;height:85vw;background:var(--b2);right:-36vw;top:18%;transform:translate(calc(var(--p)*-26px),calc(var(--p)*8px))}
.b3{width:80vw;height:80vw;background:var(--b3);left:-24vw;top:52%;transform:translate(calc(var(--p)*18px),calc(var(--p)*-16px))}
.b4{width:60vw;height:60vw;background:var(--b4);right:-14vw;bottom:-18vw;transform:translateX(calc(var(--p)*-12px))}
.grain{position:absolute;inset:0;opacity:var(--grain);mix-blend-mode:var(--grain-mode);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

/* ---------- 玻璃材质：半透明 + 高光 + 渐变描边 ---------- */
.glass{position:relative;isolation:isolate;background:var(--glass-fill);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border-radius:28px;box-shadow:var(--glass-shadow)}
.glass.strong{background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(130% 70% at 18% -10%,var(--spec) 0%,transparent 52%);transition:opacity .3s}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,var(--rim-hi),var(--rim-lo) 34%,var(--rim-lo) 66%,var(--rim-mid));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.ink{background:var(--ink);color:var(--ink-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 24px rgba(0,0,0,.18)}
.press{transition:transform .36s var(--spring),box-shadow .36s var(--ease)}
.press:active{transform:scale(.975);box-shadow:var(--press-shadow);transition-duration:.12s}
.press:active::before{opacity:.55}

/* ---------- 页面 ---------- */
#app{position:relative;z-index:1;height:100%;transition:filter .38s var(--ease),transform .38s var(--ease)}
#app.dim{filter:blur(14px);transform:scale(.97);pointer-events:none}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px 150px;display:none;
  transition:opacity .34s var(--ease),transform .34s var(--ease),filter .34s var(--ease);scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.show{display:block}
.page.enter{opacity:0;transform:translateY(14px);filter:blur(8px)}
.page.leave{opacity:0;transform:scale(.98);filter:blur(4px);pointer-events:none}

.title{font-size:30px;font-weight:600;margin:2px 0 0;letter-spacing:-.01em}
.date{font-size:14px;color:var(--sub);letter-spacing:.02em}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.icon-btn{width:46px;height:46px;border-radius:23px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.sub{font-size:14px;color:var(--sub)}
.tiny{font-size:12px;color:var(--sub);margin-top:6px;letter-spacing:.02em}

.card{padding:24px;width:100%}
.main-card{height:214px;display:flex;flex-direction:column;text-align:left}
.label{font-size:15px;font-weight:500;color:var(--sub)}
.amount{display:flex;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:"SF Pro Display",-apple-system,"Helvetica Neue",system-ui,sans-serif}
.amount .cur{font-size:.42em;font-weight:400;color:var(--sub);margin-right:.18em}
.amount.big{font-size:clamp(40px,14vw,60px);font-weight:300;letter-spacing:-.03em;margin-top:6px}
.amount.mid{font-size:26px;font-weight:400;letter-spacing:-.02em}
.amount.neg .num{color:var(--warn)}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:14px;gap:10px}
.card-foot svg{width:16px;height:16px;color:var(--faint)}
.setup{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px}
.setup b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--field);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.orb svg{width:20px;height:20px}
.row-card{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:20px 22px}
.ring-wrap{position:relative;width:62px;height:62px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .rt{stroke:var(--hair)}
.ring .rp{stroke:var(--text);stroke-linecap:round;transition:stroke-dasharray .9s var(--ease)}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.add-wide{height:58px;border-radius:29px;width:100%;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.add-wide svg{width:18px;height:18px;stroke-width:2}

/* ---------- 卡片展开 ---------- */
#detail{position:fixed;z-index:8;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  padding:28px;border-radius:32px;display:none;clip-path:inset(0 round 32px);transition:clip-path .44s var(--ease);overflow:hidden}
#detail.show{display:block}
#detail .content{transition:transform .44s var(--ease)}
.d-head{display:flex;justify-content:space-between;align-items:center}
.x{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:var(--field);color:var(--sub)}
.x svg{width:15px;height:15px;stroke-width:2.2}
.extra{opacity:0;transition:opacity .2s ease}
#detail.open .extra{opacity:1;transition:opacity .32s ease .14s}
.extra hr{border:0;border-top:1px solid var(--hair);margin:22px 0}
.d-row{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;margin:16px 0;color:var(--sub)}
.d-row b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.d-msg{font-size:16px;color:var(--sub);margin:0;line-height:1.6}

/* ---------- 底部导航：液态玻璃 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:12px;align-items:center;
  padding:0 18px calc(env(safe-area-inset-bottom,0px) + 8px);transition:filter .38s var(--ease)}
.tabs{flex:1;display:flex;padding:5px;border-radius:999px}
.pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:999px;z-index:0;
  background:var(--pill);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 .5px rgba(20,20,40,.06),0 4px 14px rgba(20,20,40,.10);
  transform:translateX(calc(var(--i,0)*100%));transition:transform .46s cubic-bezier(.25,1.08,.4,1),scale .24s var(--ease)}
.pill.stretch{scale:1.1 .92}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;
  color:var(--sub);opacity:.75;transform:scale(.95);font-size:10.5px;font-weight:600;letter-spacing:.02em;
  transition:color .3s,opacity .3s,transform .38s var(--ease)}
.tab.on{color:var(--text);opacity:1;transform:scale(1)}
.fab{width:62px;height:62px;border-radius:31px;display:grid;place-items:center;flex:none;position:relative}
.fab svg{width:24px;height:24px;stroke-width:2}

/* ---------- 弹出面板 ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .38s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px + var(--kb,0px));
  padding:12px 22px 22px;border-radius:36px;
  transform:translateY(calc(100% + 40px)) scale(.97);transform-origin:bottom center;opacity:0;visibility:hidden;
  max-height:calc(100dvh - var(--kb,0px) - env(safe-area-inset-top,0px) - 40px);overflow-y:auto;
  transition:transform .4s var(--ease),opacity .3s var(--ease),visibility 0s linear .4s}
.sheet.on{transform:none;opacity:1;visibility:visible;transition:transform .4s var(--ease),opacity .3s var(--ease),visibility 0s}
.grab{width:36px;height:5px;border-radius:3px;background:var(--faint);opacity:.5;margin:0 auto 16px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-head h2{font-size:18px;margin:0;font-weight:600}
.big-in{display:flex;align-items:baseline;gap:6px;margin-bottom:22px;font-family:"SF Pro Display",-apple-system,system-ui,sans-serif}
.big-in span{font-size:26px;font-weight:400;color:var(--sub)}
.big-in input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:56px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-in input::placeholder{color:var(--faint)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--sub);transition:color .2s}
.cat .dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--field);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 0 0 .5px var(--hair);transition:transform .34s var(--spring),background .25s,color .25s}
.cat .dot svg{width:22px;height:22px}
.cat:active .dot{transform:scale(.94)}
.cat.on{color:var(--text)}
.cat.on .dot{background:var(--ink);color:var(--ink-text);transform:scale(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px rgba(0,0,0,.14)}
.field{display:flex;align-items:center;gap:8px;padding:14px 16px;border-radius:16px;background:var(--field);box-shadow:inset 0 0 0 .5px var(--hair)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.field input::placeholder{color:var(--faint)}
.save{margin-top:18px;height:56px;border-radius:28px;font-weight:600;font-size:16px;width:100%;transition:opacity .2s,transform .34s var(--spring)}
.save:active{transform:scale(.975)}
.save:disabled{opacity:.28}
.done{font-size:16px;font-weight:600;padding:6px 4px}
.sec{display:block;font-size:13px;font-weight:500;color:var(--sub);margin:18px 6px 8px}
.fx-list{border-radius:16px;background:var(--field);margin-bottom:10px;overflow:hidden;box-shadow:inset 0 0 0 .5px var(--hair)}
.fx-list:empty{display:none}
.fx{display:flex;align-items:center;padding:10px 10px 10px 16px;gap:10px;font-size:16px}
.fx + .fx{border-top:1px solid var(--hair)}
.fx .v{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums}
.fx .x{width:28px;height:28px}
#fxAmt{flex:0 0 76px;text-align:right}
.mini-add{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;flex:none;transition:opacity .2s}
.mini-add:disabled{opacity:.22}
.mini-add svg{width:16px;height:16px;stroke-width:2.2}
.foot{font-size:12px;color:var(--sub);margin:12px 6px 0;line-height:1.6}

/* ---------- 记录 ---------- */
.hint{font-size:13px;color:var(--sub);margin:6px 0 4px}
.day{margin-top:20px}
.day-head{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;font-weight:500;padding:0 8px 8px;letter-spacing:.02em}
.day-head span:last-child{font-variant-numeric:tabular-nums}
.rows{border-radius:24px;overflow:hidden}
.item{position:relative;overflow:hidden;transition:height .3s var(--ease),opacity .25s}
.item + .item::before{content:"";position:absolute;top:0;left:70px;right:0;border-top:1px solid var(--hair)}
.item-main{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;position:relative;z-index:1;transition:transform .38s var(--ease)}
.item.open .item-main{transform:translateX(-86px)}
.del{position:absolute;right:12px;top:50%;transform:translateY(-50%) scale(.9);opacity:0;height:38px;padding:0 16px;border-radius:19px;
  background:var(--warn);color:#fff;font-weight:600;font-size:14px;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:opacity .25s,transform .34s var(--spring)}
.item.open .del{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--field);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 0 0 .5px var(--hair);color:var(--text)}
.ic svg{width:19px;height:19px;opacity:.85}
.it-text{flex:1;display:flex;flex-direction:column;min-width:0;text-align:left;gap:1px}
.it-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-time{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.it-amt{font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sub);padding-top:100px;line-height:1.7;font-size:15px}
.empty .orb{width:64px;height:64px;margin:0 auto 16px;color:var(--sub)}
.empty .orb svg{width:26px;height:26px}

/* ---------- 统计 ---------- */
.donut-wrap{position:relative;padding:28px}
.donut{width:100%;max-width:230px;display:block;margin:0 auto;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:12}
.donut .track{stroke:var(--hair)}
.donut .seg{transition:stroke-dasharray .8s var(--ease),stroke-dashoffset .8s var(--ease)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lg + .lg{margin-top:20px}
.lg-top{display:flex;align-items:center;gap:10px;font-size:15px}
.sw{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lg-name{font-weight:500}
.lg-pct{margin-left:auto;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.lg-amt{font-weight:500;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.bar{height:4px;border-radius:2px;margin-top:10px;overflow:hidden;background:var(--hair)}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--c);transition:width .8s var(--ease)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30;transform:translate(-50%,-16px);opacity:0;
  display:flex;align-items:center;gap:8px;padding:10px 18px 10px 14px;border-radius:22px;font-size:14px;font-weight:500;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--ease)}
.toast svg{width:16px;height:16px;stroke-width:2.2}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .page{transition:opacity .2s ease-out}
  .page.enter,.page.leave{transform:none;filter:none}
  .sheet{transform:none;transition:opacity .2s,visibility 0s linear .2s}
  .sheet.on{transition:opacity .2s,visibility 0s}
  .blob{transition:none}
  .pill{transition:transform .2s ease-out}
  .pill.stretch{scale:none}
  .press:active,.save:active,.cat:active .dot{transform:none}
  #app.dim{transform:none}
  #detail,#detail .content{transition:none}
  .item-main,.donut .seg,.bar i,.ring .rp{transition-duration:.01s}
}
</style>
</head>
<body>

<div class="bg" id="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="grain"></div>
</div>

<div id="app">
  <section class="page show" id="p-home">
    <div class="head">
      <div>
        <div class="date" id="today"></div>
        <h1 class="title">还能安心花多少</h1>
      </div>
      <button class="icon-btn glass press" id="openSet" aria-label="设置">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="stack">
      <button class="glass press setup" id="setup">
        <span class="orb"><svg class="i" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2.5"/><path d="M16 13.5h.01" stroke-width="2.6"/></svg></span>
        <span style="flex:1"><b>先填一下每月收入</b><span class="sub">再加上房租这类固定支出，就能算出来</span></span>
        <svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--faint)"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="glass press card main-card" id="mainCard" aria-label="查看明细">
        <span class="label">这个月还可以花</span>
        <span class="amount big" id="remain"><span class="cur">¥</span><span class="num">0</span></span>
        <span class="card-foot"><span id="msg"></span><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
      </button>
      <div class="glass row-card">
        <div>
          <div class="sub" id="perdayLabel">平均每天还能花</div>
          <div class="amount mid" id="perday" style="margin-top:4px"><span class="cur">¥</span><span class="num">0</span></div>
          <div class="tiny" id="daysLeft"></div>
        </div>
        <div class="ring-wrap" aria-hidden="true">
          <svg class="ring" viewBox="0 0 62 62"><circle class="rt" cx="31" cy="31" r="26"/><circle class="rp" id="ringP" cx="31" cy="31" r="26"/></svg>
          <span class="ring-txt" id="ringTxt">0%</span>
        </div>
      </div>
      <button class="glass press add-wide" id="addWide"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>记一笔</button>
    </div>
  </section>

  <section class="page" id="p-records">
    <h1 class="title">我花了些什么</h1>
    <p class="hint" id="recHint">轻点一条记录，可以删除</p>
    <div id="recList"></div>
  </section>

  <section class="page" id="p-stats">
    <h1 class="title">钱都花在哪了</h1>
    <div class="stack" id="statsBody" style="margin-top:20px">
      <div class="glass donut-wrap">
        <svg class="donut" viewBox="0 0 200 200" id="donut"><circle class="track" cx="100" cy="100" r="80"/></svg>
        <div class="donut-center">
          <div class="sub">本月支出</div>
          <div class="amount mid" id="statTotal"><span class="cur">¥</span><span class="num">0</span></div>
        </div>
      </div>
      <div class="glass card" id="legend"></div>
    </div>
    <div class="empty" id="statsEmpty">
      <div class="orb"><svg class="i" viewBox="0 0 24 24"><path d="M20.5 13A8.5 8.5 0 1 1 11 3.5V13z"/><path d="M14.5 3.7a8.5 8.5 0 0 1 5.8 5.8h-5.8z"/></svg></div>
      这个月还没有支出<br>记一笔之后，这里会出现分布图
    </div>
  </section>
</div>

<div id="detail" class="glass strong" role="dialog" aria-label="本月明细">
  <div class="content">
    <div class="d-head">
      <span class="label">这个月还可以花</span>
      <button class="x" id="closeDetail" aria-label="收起"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="amount big" id="dRemain"><span class="cur">¥</span><span class="num">0</span></div>
    <div class="extra">
      <hr>
      <div class="d-row"><span>每月收入</span><b id="dIncome"></b></div>
      <div class="d-row"><span>固定支出</span><b id="dFixed"></b></div>
      <div class="d-row"><span>本月已花</span><b id="dSpent"></b></div>
      <hr>
      <p class="d-msg" id="dMsg"></p>
    </div>
  </div>
</div>

<nav class="tabbar" id="tabbar">
  <div class="tabs glass" id="tabs">
    <span class="pill" id="pill" aria-hidden="true"></span>
    <button class="tab on" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>首页</button>
    <button class="tab" data-tab="records"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.6"/></svg>记录</button>
    <button class="tab" data-tab="stats"><svg class="i" viewBox="0 0 24 24"><path d="M20.5 13A8.5 8.5 0 1 1 11 3.5V13z"/><path d="M14.5 3.7a8.5 8.5 0 0 1 5.8 5.8h-5.8z"/></svg>统计</button>
  </div>
  <button class="fab ink press" id="fab" aria-label="记一笔"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<div class="scrim" id="scrim"></div>

<div class="sheet glass strong" id="addSheet" role="dialog" aria-label="记一笔">
  <div class="grab"></div>
  <div class="sh-head">
    <h2>记一笔</h2>
    <button class="x" data-close aria-label="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="big-in"><span>¥</span><input id="amtIn" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="金额"></div>
  <div class="cats" id="cats"></div>
  <div class="field"><input id="noteIn" placeholder="备注（可以不写）" maxlength="30" autocomplete="off"></div>
  <button class="save ink" id="saveBtn" disabled>保存</button>
</div>

<div class="sheet glass strong" id="setSheet" role="dialog" aria-label="设置">
  <div class="grab"></div>
  <div class="sh-head"><h2>设置</h2><button class="done" data-close>完成</button></div>
  <label class="sec" for="incomeIn">每月收入</label>
  <div class="field"><span class="sub">¥</span><input id="incomeIn" inputmode="decimal" placeholder="比如 8000" autocomplete="off"></div>
  <label class="sec" for="fxName">每月固定支出</label>
  <div class="fx-list" id="fxList"></div>
  <div class="field">
    <input id="fxName" placeholder="比如 房租" maxlength="12" autocomplete="off">
    <input id="fxAmt" inputmode="decimal" placeholder="金额" autocomplete="off">
    <button class="mini-add ink" id="fxAdd" disabled aria-label="添加"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <p class="foot">房租、话费、会员这类每月都要付的钱。点 × 可以删除。<br>所有数据只保存在这台手机的浏览器里。</p>
</div>

<div class="toast glass strong" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const ICON = {
    food:'<path d="M7 3v7.5M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 10.5V21"/><path d="M17.5 21V3c-2 0-3.5 2.5-3.5 6s1.5 4.5 3.5 4.5"/>',
    transport:'<rect x="5" y="3" width="14" height="14" rx="3.5"/><path d="M5 10.5h14M8.5 20.5l1.2-3.5M15.5 20.5l-1.2-3.5"/><path d="M8.6 13.8h.01M15.4 13.8h.01" stroke-width="2.4"/>',
    shopping:'<path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/>',
    fun:'<path d="M4 7h16v3.2a1.8 1.8 0 0 0 0 3.6V17H4v-3.2a1.8 1.8 0 0 0 0-3.6z"/><path d="M14.5 7.5v1.5M14.5 11.25v1.5M14.5 15v1.5"/>',
    other:'<circle cx="6" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18" cy="12" r="1.1"/>'
  };
  const svg = (k, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[k]}</svg>`;
  const CATS = [
    {k:'food',      n:'吃饭', c:'#d9a27c'},
    {k:'transport', n:'交通', c:'#86a3cb'},
    {k:'shopping',  n:'购物', c:'#cf98a9'},
    {k:'fun',       n:'娱乐', c:'#a397cb'},
    {k:'other',     n:'其他', c:'#94b39e'}
  ];
  const catOf = k => CATS.find(c => c.k === k) || CATS[4];
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  let RM = mq.matches;
  mq.addEventListener && mq.addEventListener('change', e => RM = e.matches);

  // ---------- 本地存储 ----------
  const KEY = 'anxin-ledger-v1';
  let storageOk = true;
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.expenses)) return {income:+s.income || 0, fixed:Array.isArray(s.fixed) ? s.fixed : [], expenses:s.expenses};
    }catch(e){ storageOk = false; }
    return {income:0, fixed:[], expenses:[]};
  }
  const state = load();
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ if (storageOk){ storageOk = false; toast('没能保存到手机，关闭页面后可能丢失', false); } }
  }

  // ---------- 工具 ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = v => (Math.round(Math.abs(v) * 100) / 100).toLocaleString('zh-CN', {maximumFractionDigits:2});
  const parseAmt = s => {
    const v = parseFloat(String(s).replace(/,/g,'.').replace(/[^\d.]/g,''));
    return v > 0 ? Math.round(v * 100) / 100 : null;
  };
  let toastT;
  function toast(t, ok = true){
    const el = $('#toast');
    el.innerHTML = (ok ? '<svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : '') + esc(t);
    el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1600);
  }

  function setAmt(el, v){
    el.querySelector('.cur').textContent = v < 0 ? '−¥' : '¥';
    el.querySelector('.num').textContent = fmt(v);
    el.classList.toggle('neg', v < 0);
  }
  function countTo(el, v){
    const from = +(el.dataset.v || 0);
    el.dataset.v = v;
    cancelAnimationFrame(el._raf);
    if (RM || Math.abs(from - v) < 0.005){ setAmt(el, v); return; }
    const t0 = performance.now(), d = 700;
    const step = t => {
      const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3);
      setAmt(el, p < 1 ? Math.round(from + (v - from) * e) : v);
      if (p < 1) el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
  }

  function isThisMonth(ms){
    const d = new Date(ms), n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
  }
  function summary(){
    const n = new Date();
    const fixed = state.fixed.reduce((a,f) => a + f.amount, 0);
    const spent = state.expenses.filter(e => isThisMonth(e.date)).reduce((a,e) => a + e.amount, 0);
    const available = state.income - fixed, remaining = available - spent;
    const daysLeft = Math.max(new Date(n.getFullYear(), n.getMonth()+1, 0).getDate() - n.getDate() + 1, 1);
    let msg;
    if (state.income <= 0) msg = '填好每月收入后，这里会帮你算好';
    else if (remaining < 0) msg = '这个月稍微超了一点，下个月重新开始';
    else if (available > 0 && remaining / available > .5) msg = '还很宽裕，可以放心花';
    else msg = '还不错，稍微留意一下就好';
    const ratio = available > 0 ? Math.min(Math.max(remaining / available, 0), 1) : 0;
    return {income:state.income, fixed, spent, remaining, daysLeft, perDay:Math.max(remaining,0)/daysLeft, msg, ratio};
  }

  // ---------- 首页 ----------
  $('#today').textContent = new Date().toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'long'});
  const RC = 2 * Math.PI * 26;
  function renderHome(){
    const s = summary();
    $('#setup').style.display = state.income > 0 ? 'none' : '';
    countTo($('#remain'), s.remaining);
    countTo($('#dRemain'), s.remaining);
    $('#msg').textContent = s.msg;
    $('#dMsg').textContent = s.msg;
    $('#dIncome').textContent = '¥' + fmt(s.income);
    $('#dFixed').textContent = '− ¥' + fmt(s.fixed);
    $('#dSpent').textContent = '− ¥' + fmt(s.spent);
    const pd = $('#perday');
    if (s.remaining > 0){
      $('#perdayLabel').textContent = '平均每天还能花';
      pd.style.display = '';
      countTo(pd, s.perDay);
    } else {
      $('#perdayLabel').textContent = '这几天先省着点花';
      pd.style.display = 'none';
    }
    $('#daysLeft').textContent = `本月还剩 ${s.daysLeft} 天`;
    $('#ringP').style.strokeDasharray = `${s.ratio * RC} ${RC}`;
    $('#ringTxt').textContent = Math.round(s.ratio * 100) + '%';
  }

  // ---------- 记录 ----------
  function dayTitle(d){
    const t = new Date(); t.setHours(0,0,0,0);
    const diff = Math.round((t - d) / 864e5);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    return `${d.getMonth()+1}月${d.getDate()}日`;
  }
  const EMPTY_LIST = '<div class="empty"><div class="orb"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.6"/></svg></div>还没有记录<br>点右下角的 ＋ 记下第一笔</div>';
  function renderRecords(){
    const list = [...state.expenses].sort((a,b) => b.date - a.date);
    $('#recHint').style.display = list.length ? '' : 'none';
    if (!list.length){ $('#recList').innerHTML = EMPTY_LIST; return; }
    const groups = new Map();
    list.forEach(e => {
      const d = new Date(e.date); d.setHours(0,0,0,0);
      const k = d.getTime();
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    });
    let html = '';
    groups.forEach((items, k) => {
      const sum = items.reduce((a,e) => a + e.amount, 0);
      html += `<div class="day"><div class="day-head"><span>${dayTitle(new Date(k))}</span><span>¥${fmt(sum)}</span></div><div class="glass rows">`;
      items.forEach(e => {
        const c = catOf(e.cat);
        const time = new Date(e.date).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        html += `<div class="item" data-id="${e.id}">
          <button class="item-main"><span class="ic">${svg(c.k)}</span>
          <span class="it-text"><span class="it-name">${esc(e.note || c.n)}</span><span class="it-time">${e.note ? c.n + ' · ' : ''}${time}</span></span>
          <span class="it-amt">¥${fmt(e.amount)}</span></button>
          <button class="del">删除</button></div>`;
      });
      html += '</div></div>';
    });
    $('#recList').innerHTML = html;
  }
  $('#recList').addEventListener('click', ev => {
    const item = ev.target.closest('.item'); if (!item) return;
    if (ev.target.closest('.del')){
      item.style.height = item.offsetHeight + 'px';
      void item.offsetHeight;
      item.style.height = '0px'; item.style.opacity = '0';
      setTimeout(() => {
        state.expenses = state.expenses.filter(e => e.id !== item.dataset.id);
        persist(); render();
      }, RM ? 0 : 300);
      return;
    }
    const wasOpen = item.classList.contains('open');
    document.querySelectorAll('.item.open').forEach(i => i.classList.remove('open'));
    if (!wasOpen) item.classList.add('open');
  });

  // ---------- 统计 ----------
  const R = 80, C = 2 * Math.PI * R;
  const donut = $('#donut');
  CATS.forEach(c => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('class', 'seg'); el.setAttribute('cx', 100); el.setAttribute('cy', 100); el.setAttribute('r', R);
    el.setAttribute('stroke', c.c); el.dataset.k = c.k;
    el.style.strokeDasharray = `0 ${C}`;
    donut.appendChild(el);
  });
  function resetDonut(){
    donut.querySelectorAll('.seg').forEach(s => { s.style.strokeDasharray = `0 ${C}`; s.style.strokeDashoffset = '0'; });
  }
  function renderStats(){
    const totals = {}; CATS.forEach(c => totals[c.k] = 0);
    state.expenses.filter(e => isThisMonth(e.date)).forEach(e => totals[catOf(e.cat).k] += e.amount);
    const total = Object.values(totals).reduce((a,b) => a + b, 0);
    $('#statsBody').style.display = total > 0 ? '' : 'none';
    $('#statsEmpty').style.display = total > 0 ? 'none' : '';
    if (!total) return;
    const nonzero = CATS.filter(c => totals[c.k] > 0).length;
    let acc = 0;
    CATS.forEach(c => {
      const seg = donut.querySelector(`.seg[data-k="${c.k}"]`);
      const len = totals[c.k] / total * C;
      const gap = len > 0 && nonzero > 1 ? 5 : 0;
      seg.style.strokeDasharray = `${Math.max(len - gap, 0)} ${C}`;
      seg.style.strokeDashoffset = `${-acc}`;
      acc += len;
    });
    countTo($('#statTotal'), total);
    const sorted = CATS.filter(c => totals[c.k] > 0).sort((a,b) => totals[b.k] - totals[a.k]);
    $('#legend').innerHTML = sorted.map(c => {
      const pct = totals[c.k] / total * 100;
      return `<div class="lg" style="--c:${c.c}"><div class="lg-top"><span class="sw"></span>
        <span class="lg-name">${c.n}</span><span class="lg-pct">${Math.round(pct)}%</span>
        <span class="lg-amt">¥${fmt(totals[c.k])}</span></div>
        <div class="bar"><i data-w="${pct}"></i></div></div>`;
    }).join('');
    requestAnimationFrame(() => requestAnimationFrame(() =>
      $('#legend').querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%')));
  }

  function render(){ renderHome(); renderRecords(); renderStats(); }

  // ---------- 页面切换 ----------
  const pages = {home:$('#p-home'), records:$('#p-records'), stats:$('#p-stats')};
  const order = ['home','records','stats'];
  const pill = $('#pill');
  let cur = 'home', leaveT, stretchT;
  function go(t){
    if (t === cur) return;
    closeDetail(true);
    const old = pages[cur], nw = pages[t];
    clearTimeout(leaveT);
    Object.values(pages).forEach(p => { if (p !== old && p !== nw) p.classList.remove('show','leave','enter'); });
    if (t === 'stats') resetDonut();
    old.classList.remove('enter'); old.classList.add('leave');
    nw.classList.remove('leave'); nw.classList.add('show','enter');
    nw.scrollTop = 0;
    void nw.offsetWidth;
    requestAnimationFrame(() => nw.classList.remove('enter'));
    if (t === 'stats') requestAnimationFrame(() => requestAnimationFrame(renderStats));
    leaveT = setTimeout(() => old.classList.remove('show','leave'), RM ? 200 : 360);
    cur = t;
    const i = order.indexOf(t);
    $('#tabs').style.setProperty('--i', i);
    pill.style.setProperty('--i', i);
    if (!RM){
      pill.classList.add('stretch');
      clearTimeout(stretchT); stretchT = setTimeout(() => pill.classList.remove('stretch'), 200);
    }
    $('#bg').style.setProperty('--p', i);
    document.querySelectorAll('.tab').forEach(b => {
      const on = b.dataset.tab === t;
      b.classList.toggle('on', on);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

  // ---------- 卡片展开 ----------
  const detail = $('#detail'), content = detail.querySelector('.content'), app = $('#app'), mainCard = $('#mainCard');
  let detailOpen = false, detailT;
  function geometry(){
    const r = mainCard.getBoundingClientRect(), d = detail.getBoundingClientRect();
    return {
      clip: `inset(${r.top-d.top}px ${d.right-r.right}px ${d.bottom-r.bottom}px ${r.left-d.left}px round 28px)`,
      move: `translate(${(r.left+24)-(d.left+28)}px, ${(r.top+24)-(d.top+28)}px)`
    };
  }
  function openDetail(){
    if (detailOpen) return;
    detailOpen = true; clearTimeout(detailT);
    detail.classList.add('show');
    if (!RM){
      const g = geometry();
      detail.style.transition = 'none'; content.style.transition = 'none';
      detail.style.clipPath = g.clip; content.style.transform = g.move;
      void detail.offsetWidth;
      detail.style.transition = ''; content.style.transition = '';
    }
    requestAnimationFrame(() => {
      detail.style.clipPath = 'inset(0 round 32px)';
      content.style.transform = 'none';
      detail.classList.add('open');
    });
    app.classList.add('dim');
    mainCard.style.visibility = 'hidden';
  }
  function closeDetail(instant){
    if (!detailOpen) return;
    detailOpen = false;
    app.classList.remove('dim');
    const finish = () => {
      detail.classList.remove('show','open');
      detail.style.clipPath = ''; content.style.transform = '';
      mainCard.style.visibility = '';
    };
    if (instant || RM){ finish(); return; }
    const g = geometry();
    detail.style.clipPath = g.clip; content.style.transform = g.move;
    detail.classList.remove('open');
    detailT = setTimeout(finish, 440);
  }
  mainCard.addEventListener('click', openDetail);
  $('#closeDetail').addEventListener('click', () => closeDetail());

  // ---------- 弹出面板 ----------
  const scrim = $('#scrim');
  let sheet = null;
  function openSheet(sh, focusEl){
    closeDetail(true);
    scrim.classList.add('on'); sh.classList.add('on'); sheet = sh;
    $('#tabbar').style.filter = 'blur(4px)';
    if (focusEl) focusEl.focus({preventScroll:true});
  }
  function closeSheet(){
    if (document.activeElement) document.activeElement.blur();
    scrim.classList.remove('on');
    if (sheet) sheet.classList.remove('on');
    sheet = null;
    $('#tabbar').style.filter = '';
  }
  scrim.addEventListener('click', closeSheet);
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  document.addEventListener('keydown', e => { if (e.key === 'Escape'){ sheet ? closeSheet() : closeDetail(); } });

  if (window.visualViewport){
    const vv = visualViewport;
    const fit = () => {
      const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb + 'px');
    };
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
  }

  // 记一笔
  let selCat = 'food';
  const amtIn = $('#amtIn'), noteIn = $('#noteIn'), saveBtn = $('#saveBtn');
  $('#cats').innerHTML = CATS.map(c =>
    `<button class="cat" data-k="${c.k}" aria-pressed="false"><span class="dot">${svg(c.k)}</span>${c.n}</button>`).join('');
  function pickCat(k){
    selCat = k;
    document.querySelectorAll('.cat').forEach(b => {
      const on = b.dataset.k === k;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
  }
  $('#cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) pickCat(b.dataset.k); });
  amtIn.addEventListener('input', () => { saveBtn.disabled = parseAmt(amtIn.value) === null; });
  function openAdd(){
    amtIn.value = ''; noteIn.value = ''; saveBtn.disabled = true; pickCat('food');
    openSheet($('#addSheet'), amtIn);
  }
  $('#fab').addEventListener('click', openAdd);
  $('#addWide').addEventListener('click', openAdd);
  function save(){
    const a = parseAmt(amtIn.value); if (a === null) return;
    state.expenses.push({id:uid(), amount:a, cat:selCat, note:noteIn.value.trim(), date:Date.now()});
    persist(); closeSheet();
    setTimeout(render, RM ? 0 : 180);
    toast('已保存');
  }
  saveBtn.addEventListener('click', save);
  noteIn.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });

  // 设置
  const incomeIn = $('#incomeIn'), fxName = $('#fxName'), fxAmt = $('#fxAmt'), fxAdd = $('#fxAdd');
  function renderFixed(){
    $('#fxList').innerHTML = state.fixed.map(f =>
      `<div class="fx" data-id="${f.id}"><span>${esc(f.name)}</span><span class="v">¥${fmt(f.amount)}</span>
       <button class="x" aria-label="删除${esc(f.name)}"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`).join('');
  }
  function openSet(){
    incomeIn.value = state.income > 0 ? state.income : '';
    renderFixed();
    openSheet($('#setSheet'));
  }
  $('#openSet').addEventListener('click', openSet);
  $('#setup').addEventListener('click', openSet);
  incomeIn.addEventListener('input', () => { state.income = parseAmt(incomeIn.value) || 0; persist(); renderHome(); });
  const checkFx = () => { fxAdd.disabled = !fxName.value.trim() || parseAmt(fxAmt.value) === null; };
  fxName.addEventListener('input', checkFx); fxAmt.addEventListener('input', checkFx);
  fxAdd.addEventListener('click', () => {
    const a = parseAmt(fxAmt.value), n = fxName.value.trim();
    if (!n || a === null) return;
    state.fixed.push({id:uid(), name:n, amount:a});
    persist(); renderFixed(); renderHome();
    fxName.value = ''; fxAmt.value = ''; checkFx();
  });
  $('#fxList').addEventListener('click', e => {
    const row = e.target.closest('.fx');
    if (!row || !e.target.closest('.x')) return;
    state.fixed = state.fixed.filter(f => f.id !== row.dataset.id);
    persist(); renderFixed(); renderHome();
  });

  render();

  // 离线缓存：装到主屏幕后，飞行模式也能打开
  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
